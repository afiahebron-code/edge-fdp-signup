name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: |
          npm install -g wrangler@3.99.0
          # Account ID is optional: wrangler finds it from the token when there's only one account.
          if [ -n "$ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"; fi
      - name: Create database (first run only) and apply tables
        working-directory: worker
        run: |
          find_id() { wrangler d1 list --json | jq -r '.[] | select(.name=="edge-fdp-signup") | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then wrangler d1 create edge-fdp-signup; ID=$(find_id); fi
          echo "Database id: $ID"
          sed -i "s/database_id = \"REPLACE\"/database_id = \"$ID\"/" wrangler.toml
          wrangler d1 execute edge-fdp-signup --remote --file schema.sql
      - name: Make sure the account has a workers.dev address
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$CUR" ]; then
            for NAME in edgefdp edge-fdp-class edgefdp-$(date +%s | tail -c 5); do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                --data "{\"subdomain\":\"$NAME\"}" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
              echo "$R" | jq -c '{success, errors}'
              if [ "$(echo "$R" | jq -r .success)" = "true" ]; then CUR=$NAME; break; fi
            done
          fi
          echo "workers.dev subdomain: $CUR"
      - name: Deploy worker and pages
        working-directory: worker
        run: wrangler deploy
      - name: Set admin password
        working-directory: worker
        run: echo "$ADMIN_KEY" | wrangler secret put ADMIN_KEY
